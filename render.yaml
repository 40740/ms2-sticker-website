services:
  # ===== Web Service (Laravel + PHP Docker) =====
  - type: web
    name: ms2-sticker-website
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://ms2-sticker-website.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromService:
          type: pserv
          name: ms2-db
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: ms2-db
          property: port
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        value: ms2_db_password_render
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: public

  # ===== PostgreSQL Database (pserv = Persistent Docker Service) =====
  - type: pserv
    name: ms2-db
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.db
    dockerContext: .
    startCommand: postgres
    envVars:
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: ms2_db_password_render
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
