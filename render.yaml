services:
  # Web Service
  - type: web
    name: ms2-sticker-website
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: APP_NAME
        value: MeisaiPrinting
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:WdkEuwWcUxx5AmIM8ZKKGrFYltrc9oQmAy72nRJhiHU=
      - key: APP_URL
        value: https://ms2-sticker-website.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ms2-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ms2-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ms2-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ms2-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ms2-db
          property: password
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: public

databases:
  # PostgreSQL Database (免费套餐: 1GB)
  - name: ms2-db
    plan: free
    region: oregon
    databaseName: ms2_production
