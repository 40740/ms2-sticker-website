services:
  # Web Service
  - type: web
    name: ms2-sticker-website
    env: php
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      npm install
      npm run build
    startCommand: bash start.sh
    envVars:
      - key: APP_NAME
        value: MeisaiPrinting
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: ms2-sticker-website
          property: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ms2-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ms2-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ms2-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ms2-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ms2-db
          property: password
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: public

databases:
  # PostgreSQL Database (免费套餐: 1GB)
  - name: ms2-db
    plan: free
    region: oregon
    databaseName: ms2_production
